<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" font-family="Arial, sans-serif" font-size="18">
  <rect width="820" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d62728"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f77b4"/></marker>
    <marker id="ak" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
  </defs>
  <!-- axis -->
  <line x1="80" y1="250" x2="790" y2="250" stroke="#000" stroke-width="1.5" marker-end="url(#ak)"/>
  <text x="772" y="240">ось</text>
  <!-- ring -->
  <ellipse cx="220" cy="250" rx="45" ry="150" fill="none" stroke="#444" stroke-width="5"/>
  <text x="40" y="60">кольцо радиуса R, заряд q</text>
  <!-- center -->
  <circle cx="220" cy="250" r="4" fill="#000"/>
  <text x="195" y="275">O</text>
  <!-- radius R -->
  <line x1="220" y1="250" x2="220" y2="100" stroke="#000" stroke-dasharray="6,4"/>
  <text x="228" y="180">R</text>
  <!-- charges dq -->
  <circle cx="220" cy="100" r="7" fill="#d62728"/>
  <text x="235" y="92" fill="#d62728">Δq</text>
  <circle cx="220" cy="400" r="7" fill="#1f77b4"/>
  <text x="235" y="420" fill="#1f77b4">Δq</text>
  <!-- distances r -->
  <line x1="220" y1="100" x2="550" y2="250" stroke="#d62728" stroke-dasharray="6,4"/>
  <text x="380" y="160" fill="#d62728">r = √(R² + x²)</text>
  <line x1="220" y1="400" x2="550" y2="250" stroke="#1f77b4" stroke-dasharray="6,4"/>
  <!-- point A -->
  <circle cx="550" cy="250" r="5" fill="#000"/>
  <text x="535" y="235">A</text>
  <!-- field vectors from each dq -->
  <line x1="550" y1="250" x2="659" y2="300" stroke="#d62728" stroke-width="3" marker-end="url(#ar)"/>
  <text x="665" y="318" fill="#d62728">ΔE</text>
  <line x1="550" y1="250" x2="659" y2="200" stroke="#1f77b4" stroke-width="3" marker-end="url(#ab)"/>
  <text x="665" y="196" fill="#1f77b4">ΔE</text>
  <!-- components -->
  <line x1="659" y1="300" x2="659" y2="250" stroke="#888" stroke-dasharray="4,3"/>
  <line x1="659" y1="200" x2="659" y2="250" stroke="#888" stroke-dasharray="4,3"/>
  <text x="440" y="390" font-size="16" fill="#444">вертикальные части гасят друг друга,</text>
  <text x="440" y="410" font-size="16" fill="#444">вдоль оси — складываются</text>
  <!-- angle alpha -->
  <path d="M 505 250 A 45 45 0 0 0 509 231" fill="none" stroke="#000"/>
  <text x="482" y="240">α</text>
  <!-- x bracket -->
  <line x1="220" y1="330" x2="550" y2="330" stroke="#000" marker-end="url(#ak)"/>
  <line x1="550" y1="330" x2="220" y2="330" stroke="#000" marker-end="url(#ak)"/>
  <text x="375" y="350" font-weight="bold">x</text>
  <!-- ticks for L and 0.5L -->
  <line x1="273" y1="243" x2="273" y2="257" stroke="#2ca02c" stroke-width="3"/>
  <text x="258" y="300" fill="#2ca02c" font-size="16">0,5L</text>
  <line x1="326" y1="243" x2="326" y2="257" stroke="#2ca02c" stroke-width="3"/>
  <text x="320" y="300" fill="#2ca02c" font-size="16">L</text>
  <text x="80" y="445" font-size="16" fill="#2ca02c">L — точка, где поле максимально (L = R/√2); 0,5L — вдвое ближе к центру</text>
</svg>
